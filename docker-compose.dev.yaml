version: "3"

networks:
  whaticket_dev:

services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    hostname: whaticket-dev-backend
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DIALECT=mysql
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - BACKEND_URL=${BACKEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - PROXY_PORT=${PROXY_PORT}
      - CHROME_ARGS=--no-sandbox --disable-setuid-sandbox
      - PORT=3000
      - TZ=${TZ}
    volumes:
      - ./backend/public-dev/:/usr/src/app/public/
      - ./backend/.wwebjs_auth_dev/:/usr/src/app/.wwebjs_auth/
    depends_on:
      - mysql
    networks:
      - whaticket_dev

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    environment:
      - URL_BACKEND=backend:3000
      - REACT_APP_BACKEND_URL=http://whaticket.digiyou.com.br:8093/api
      - REACT_APP_BACKEND_SOCKET_URL=http://whaticket.digiyou.com.br:8093
      - REACT_APP_BACKEND_SOCKET_PATH=/socket.io
      - TZ=${TZ}
    ports:
      - ${FRONTEND_PORT}:80
    volumes:
      - ./docker/dev-frontend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - whaticket_dev

  mysql:
    image: ${MYSQL_ENGINE}:${MYSQL_VERSION}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    volumes:
      - ./.docker-dev/data/:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TZ}
    ports:
      - ${MYSQL_PORT}:3306
    restart: always
    networks:
      - whaticket_dev
